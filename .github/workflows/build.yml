name: Cloud Build & Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish GitHub Release & auto-updater manifest (latest.json)'
        required: false
        type: boolean
        default: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install Dependencies
      run: npm install
      
    - name: Build & Release Tauri App (with Auto-Updater)
      uses: tauri-apps/tauri-action@v0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      with:
        tagName: v__VERSION__
        releaseName: 'Arc Desktop v__VERSION__'
        releaseBody: 'Arc Desktop release with automatic background updater support.'
        releaseDraft: false
        prerelease: false

    - name: Upload Build Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Arc-Desktop-${{ runner.os }}
        path: |
          src-tauri/target/release/arc-desktop.exe
          src-tauri/target/release/bundle/nsis/*.exe
          src-tauri/target/release/bundle/dmg/*.dmg
          src-tauri/target/release/bundle/macos/*.app
          src-tauri/target/release/bundle/**/latest.json
